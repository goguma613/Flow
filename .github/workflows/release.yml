# Windows에서 시험·빌드해 GitHub 릴리스로 Flow.exe 를 낸다.
# release.ps1 과 같은 일을 PC 없이 한다. 시험이 하나라도 실패하면 아무것도 올리지 않는다.
#
# 시작하는 법 두 가지
#   - GitHub 의 Actions 탭 → release → Run workflow 에 버전과 노트를 적는다
#   - 태그를 올린다:  git tag -a v1.5.2 -m "릴리스 노트" && git push origin v1.5.2
# 어느 쪽이든 Flow.csproj 의 <Version> 이 그 버전과 같아야 한다.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '버전 (예: 1.5.2)'
        required: true
      notes:
        description: '릴리스 노트'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 시험
        shell: pwsh
        env:
          FLOW_DATA_DIR: ${{ runner.temp }}\flow-test
        run: dotnet run --project Tests/Flow.Tests -c Release

      - name: 빌드
        shell: pwsh
        run: |
          $version = '${{ env.TAG }}'.TrimStart('v')
          $csproj = Get-Content Flow/Flow.csproj -Raw
          if ($csproj -notmatch "<Version>$([regex]::Escape($version))</Version>") {
            throw "Flow.csproj 의 Version 이 태그($version)와 다릅니다."
          }
          dotnet publish Flow/Flow.csproj -c Release -o dist --nologo -v q
          if (-not (Test-Path dist/Flow.exe)) { throw "Flow.exe 가 만들어지지 않았습니다." }

      - name: 릴리스
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          $tag = '${{ env.TAG }}'
          $notes = if ($env:NOTES) { $env:NOTES } else { (git tag -l --format='%(contents)' $tag | Out-String).Trim() }
          if (-not $notes) { $notes = "Flow $($tag.TrimStart('v'))" }
          $notesFile = Join-Path $env:RUNNER_TEMP 'notes.md'
          Set-Content -LiteralPath $notesFile -Value $notes -Encoding utf8
          gh release create $tag dist/Flow.exe --title $tag --notes-file $notesFile --target '${{ github.sha }}'
